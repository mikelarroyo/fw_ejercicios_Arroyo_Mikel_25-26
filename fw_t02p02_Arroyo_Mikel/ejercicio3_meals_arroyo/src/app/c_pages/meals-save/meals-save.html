<div class="mt-5">
  <h2 class="mb-4">Últimas recetas guardadas</h2>

  @if (meals().length > 0) {
    <div class="row">
      @for (meal of meals(); track meal.mealId) {
        <div class="col-md-6 col-lg-3 mb-4">
          <div class="card h-100 shadow-sm">
            <img [ngSrc]="meal.strMealThumb" class="card-img-top" [alt]="meal.strMeal" width="400" height="200" style="object-fit: cover;">
            <div class="card-body">
              <h5 class="card-title">{{ meal.strMeal }}</h5>
              <a [routerLink]="['/details', meal.mealId]" class="btn btn-primary btn-sm">Detalles</a>
            </div>
          </div>
        </div>
      }
    </div>
  } @else {
    <div class="alert alert-info">No hay recetas guardadas</div>
  }
</div>
