<div class="container mt-4">
  <h2 class="mb-3">Mis planes semanales</h2>

  @if (planesSemanales.length === 0) {
    <div class="alert alert-info">No tienes planes semanales creados.</div>
  } @else {
    <table class="table table-bordered table-hover">
      <thead class="table-dark">
        <tr>
          <th>Semana</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        @for (plan of planesSemanales; track plan.id) {
          <tr [class.table-success]="esSemanaActual(plan.id)">
            <td>
              {{ plan.id }}
              @if (esSemanaActual(plan.id)) {
                <span class="badge bg-success ms-2">Actual</span>
              }
            </td>
            <td>
              <button class="btn btn-sm btn-danger" (click)="eliminarPlan(plan.id)">Borrar</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  }
</div>
