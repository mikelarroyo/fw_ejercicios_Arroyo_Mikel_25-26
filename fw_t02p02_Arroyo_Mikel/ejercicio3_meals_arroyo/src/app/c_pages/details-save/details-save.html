<div class="card mt-4">
  <div class="card-header">
    <h3 class="mb-0">Valoración y Notas</h3>
  </div>
  <div class="card-body">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label class="form-label">Estado:</label>
        <div class="form-check">
          <input class="form-check-input" type="radio" formControlName="status" [value]="'QUIERO_HACERLA'" id="status1">
          <label class="form-check-label" for="status1">Quiero hacerla</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" formControlName="status" [value]="'LA_HE_HECHO'" id="status2">
          <label class="form-check-label" for="status2">La he hecho</label>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Rating (1-5):</label>
        <input type="number" formControlName="rating" min="1" max="5" class="form-control">
        @if (form.get('rating')?.invalid && form.get('rating')?.touched) {
          <small class="text-danger">Rating es obligatorio si has marcado "La he hecho"</small>
        }
      </div>

      <div class="mb-3">
        <label class="form-label">Notas (máximo 250 caracteres):</label>
        <textarea formControlName="notes" class="form-control" rows="3" maxlength="250"></textarea>
      </div>

      <div class="mb-3">
        <label class="form-label">Fecha realizada:</label>
        <input type="date" formControlName="saveDate" class="form-control">
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-success" [disabled]="form.invalid">Guardar cambios</button>
        <button type="button" class="btn btn-secondary" (click)="cancel()">Cancelar</button>
      </div>
    </form>
  </div>
</div>
