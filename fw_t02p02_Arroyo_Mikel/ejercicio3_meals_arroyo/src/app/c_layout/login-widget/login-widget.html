@if (auth.isAuthenticated()) {
  <button type="button" (click)="doLogout()" class="btn btn-outline-danger btn-sm d-flex align-items-center gap-2">
    <i class="bi bi-box-arrow-right"></i>
    <span>Cerrar sesión</span>
  </button>
} @else {
  <a routerLink="/login" class="btn btn-outline-light btn-sm d-flex align-items-center gap-2">
    <i class="bi bi-person-circle"></i>
    <span>Login</span>
  </a>
}
